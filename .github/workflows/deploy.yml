name: Deploy ATS Master to ECR and EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Non-sensitive configuration is stored in GitHub Actions Variables.
# Required variables: AWS_ACCOUNT_ID, AWS_REGION, EC2_INSTANCE_ID

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  ECR_REPO_SERVER: ats-master-server
  ECR_REPO_CLIENT: ats-master-client
  ECR_REPO_PYTHON: ats-master-python-ai
  SECRET_NAME: atsmaster/production
  APP_DIR: /opt/ats-master

jobs:
  # JOB 1: Build all three Docker images and push them to ECR
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::082287604856:role/ATS-Master-GitHubActions-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag to Git commit SHA
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Node.js / Express backend
      - name: Build and push Server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_SERVER }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_SERVER }}:latest
          cache-to: type=inline

      # React / Vite frontend served by Nginx
      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_CLIENT }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_CLIENT }}:latest
          cache-to: type=inline

      # Python / Flask AI service
      - name: Build and push Python AI Service image
        uses: docker/build-push-action@v5
        with:
          context: ./python-ai-service
          file: ./python-ai-service/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_PYTHON }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_PYTHON }}:latest
          cache-to: type=inline

  # JOB 2: Deploy to EC2 via SSM Run Command
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::082287604856:role/ATS-Master-GitHubActions-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deployment command to EC2 via SSM
        id: ssm
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          PARAMS=$(python3 - <<'PYEOF'
          import json
          import os

          image_tag = os.environ["IMAGE_TAG"]
          ecr_registry = os.environ["ECR_REGISTRY"]
          server_repo = os.environ["ECR_REPO_SERVER"]
          client_repo = os.environ["ECR_REPO_CLIENT"]
          python_repo = os.environ["ECR_REPO_PYTHON"]
          secret_name = os.environ["SECRET_NAME"]
          aws_region = os.environ["AWS_REGION"]
          app_dir = os.environ["APP_DIR"]

          env_prefix = (
              f"IMAGE_TAG={image_tag} "
              f"AWS_REGION={aws_region} "
              f"ECR_REGISTRY={ecr_registry} "
              f"ECR_REPO_SERVER={server_repo} "
              f"ECR_REPO_CLIENT={client_repo} "
              f"ECR_REPO_PYTHON={python_repo} "
              f"SECRET_NAME={secret_name} "
              f"APP_DIR={app_dir}"
          )

          commands = [
              "set -euo pipefail",
              f"mkdir -p {app_dir}/scripts",
              f"curl -fsSL https://raw.githubusercontent.com/shivraj2805/ATS-Master/{image_tag}/scripts/deploy.sh -o {app_dir}/scripts/deploy.sh",
              f"chmod 750 {app_dir}/scripts/deploy.sh",
              f"{env_prefix} bash {app_dir}/scripts/deploy.sh",
          ]

          print(json.dumps({
              "commands": commands,
              "executionTimeout": ["600"]
          }))
          PYEOF
          )

          export IMAGE_TAG
          export INSTANCE_ID
          export PARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ATS Master ${IMAGE_TAG}" \
            --parameters "${PARAMS}" \
            --timeout-seconds 30 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

      - name: Wait for deployment to complete
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"

          for COUNT in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$(( COUNT * 15 ))s] Status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut)
                echo "Deployment failed with status: ${STATUS}"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text 2>/dev/null || true
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "Timed out waiting for deployment."
          exit 1
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Show EC2 deployment output
        if: always()
        shell: bash
        run: |
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"

          if [ -z "${COMMAND_ID}" ]; then
            echo "No SSM command ID was recorded."
            exit 0
          fi

          echo "=== stdout from EC2 deploy.sh ==="
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text 2>/dev/null || echo "(output not available)"

          echo "=== stderr from EC2 deploy.sh ==="
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardErrorContent" \
            --output text 2>/dev/null || echo "(output not available)"
