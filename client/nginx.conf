server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint (used by the Docker HEALTHCHECK and by the ALB
    # if you add one later). Returns 200 immediately without hitting upstream.
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Proxy all /api/* requests to the Express backend.
    # The path is forwarded unchanged: /api/auth/login → server:3001/api/auth/login
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy /python-api/* requests to the Flask AI service, stripping the
    # /python-api prefix before forwarding.
    # Example: /python-api/analyze → python-ai-service:5000/analyze
    # This matches what vite.config.js does in development mode.
    location /python-api/ {
        rewrite ^/python-api/(.*) /$1 break;
        proxy_pass http://python-ai-service:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI requests can be slow (Gemini calls, PDF processing)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React SPA: serve index.html for any unknown route so that
    # client-side routing (react-router-dom) works on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fingerprinted static assets aggressively.
    # Vite adds content hashes to JS/CSS filenames, so this is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
